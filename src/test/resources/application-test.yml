spring:
  datasource:
    url: jdbc:h2:mem:retail_pipeline_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  cache:
    type: simple
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

logging:
  level:
    com.arshadansari.retailpipeline: DEBUG
